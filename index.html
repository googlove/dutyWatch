<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Watch Command System</title>
  <style>
    :root {
      --background: #0a0f2c;
      --text: #ffffff;
      --card: #12183d;
      --accent: #00ff88;
    }

    [data-theme="light"] {
      --background: #ffffff;
      --text: #000000;
      --card: #f0f0f0;
      --accent: #007acc;
    }

    body {
      margin: 0;
      font-family: sans-serif;
      background-color: var(--background);
      color: var(--text);
      transition: all 0.3s ease;
    }

    .card {
      background-color: var(--card);
      padding: 1rem;
      border-radius: 10px;
      margin: 1rem;
    }

    .controls {
      position: fixed;
      top: 1rem;
      right: 1rem;
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }

    .online {
      color: var(--accent);
      font-weight: bold;
    }

    .dot {
      height: 10px;
      width: 10px;
      background-color: var(--accent);
      border-radius: 50%;
      display: inline-block;
      margin-right: 5px;
    }

    select {
      padding: 0.3rem;
      border-radius: 5px;
      border: 1px solid var(--accent);
      background: var(--card);
      color: var(--text);
    }

    button {
      background-color: var(--accent);
      border: none;
      padding: 0.5rem;
      border-radius: 5px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="controls">
    <button onclick="toggleTheme()">🌓</button>
    <select onchange="setLang(this.value)">
      <option value="ua">Українська</option>
      <option value="en">English</option>
    </select>
  </div>

  <div class="card">
    <h1 data-i18n="watchCommand">Watch Command System</h1>
    <div id="clock"></div>
    <div id="currentShift"></div>
    <div id="weather"></div>
    <div id="airAlert"></div>
  </div>

  <script>
    const langData = {
      en: { watchCommand: "Watch Command System", airAlert: "Air Alert", onWatch: "On watch now" },
      ua: { watchCommand: "Вахтовий Командний Центр", airAlert: "Повітряна тривога", onWatch: "Зараз на вахті" }
    };

    let lang = localStorage.getItem('lang') || 'ua';

    function setLang(l) {
      lang = l;
      localStorage.setItem('lang', lang);
      document.querySelector("select").value = lang;
      translate();
    }

    function translate() {
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        el.textContent = langData[lang][key];
      });
    }

    // Ініціалізація мови при завантаженні
    document.addEventListener("DOMContentLoaded", () => {
      setLang(lang);
    });

    function toggleTheme() {
      const theme = document.documentElement.getAttribute('data-theme');
      const newTheme = theme === 'light' ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', newTheme);
      localStorage.setItem('theme', newTheme);
    }

    document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'dark');

    // Clock
    setInterval(() => {
      const now = new Date();
      document.getElementById('clock').textContent = now.toLocaleTimeString();
      updateCurrentShift(now);
    }, 1000);

    const shifts = {
      "Tuesday": [
        { name: "Yarik", shifts: ["09:00-12:00", "21:00-00:00"] },
        { name: "Zhenya", shifts: ["12:00-15:00", "00:00-03:00"] },
        { name: "Dan", shifts: ["15:00-18:00", "03:00-06:00"] },
        { name: "Yura", shifts: ["18:00-21:00", "06:00-09:00"] },
        { name: "Gurikhanyan", status: "off" },
        { name: "Katran", status: "canteen" }
      ],
      "Wednesday": [
        { name: "Gurikhanyan", shifts: ["09:00-12:00", "21:00-00:00"] },
        { name: "Zhenya", shifts: ["12:00-15:00", "00:00-03:00"] },
        { name: "Dan", shifts: ["15:00-18:00", "03:00-06:00"] },
        { name: "Katran", shifts: ["18:00-21:00", "06:00-09:00"] },
        { name: "Yarik", status: "off" },
        { name: "Yura", status: "canteen" }
      ],
      "Thursday": [
        { name: "Gurikhanyan", shifts: ["09:00-12:00", "21:00-00:00"] },
        { name: "Yura", shifts: ["12:00-15:00", "00:00-03:00"] },
        { name: "Yarik", shifts: ["15:00-18:00", "03:00-06:00"] },
        { name: "Katran", shifts: ["18:00-21:00", "06:00-09:00"] },
        { name: "Zhenya", status: "off" },
        { name: "Dan", status: "canteen" }
      ]
    };

    function isNowInRange(rangeStr, now) {
      const [start, end] = rangeStr.split('-').map(t => {
        const [h, m] = t.split(':').map(Number);
        return h * 60 + m;
      });
      const current = now.getHours() * 60 + now.getMinutes();
      if (end < start) return current >= start || current < end; // crosses midnight
      return current >= start && current < end;
    }

    function updateCurrentShift(now) {
      const day = now.toLocaleDateString('en', { weekday: 'long' });
      let shiftHTML = `<h3>${langData[lang].onWatch}:</h3>`;
      (shifts[day] || []).forEach(person => {
        let line = "";
        if (person.shifts) {
          const activeShift = person.shifts.find(shift => isNowInRange(shift, now));
          line += activeShift
            ? `<span class="dot"></span> ${person.name} <span class="online">${langData[lang].onWatch}</span> <small>(${activeShift})</small>`
            : `${person.name}`;
        } else if (person.status === "off") {
          line += `<span style="color:red">🔴</span> ${person.name} <span style="color:red">вихідний</span>`;
        } else if (person.status === "canteen") {
          line += `🍴 ${person.name} <span style="color:orange">столова</span>`;
        }
        shiftHTML += `<div>${line}</div>`;
      });
      document.getElementById('currentShift').innerHTML = shiftHTML;
    }

    async function checkAirAlert() {
      try {
        const res = await fetch("https://alerts.com.ua/api/states");
        const data = await res.json();
        const odessaRegion = data.states.find(state => state.name === "Одеська");
        const alertEl = document.getElementById("airAlert");
        if (odessaRegion && odessaRegion.alert) {
          alertEl.textContent = `🚨 ${langData[lang].airAlert}`;
          alertEl.style.color = "red";
          if (Notification.permission === "granted") {
            new Notification(`${langData[lang].airAlert}!`, { body: "Одеська область!" });
          }
        } else {
          alertEl.textContent = `✅ ${lang === 'en' ? 'All clear' : 'Все спокійно'}`;
          alertEl.style.color = "var(--accent)";
        }
      } catch (e) {
        console.error("Air alert error:", e);
        document.getElementById("airAlert").textContent = `⚠️ ${langData[lang].airAlert} недоступна`;
      }
    }

    async function loadWeather() {
      try {
        const res = await fetch("https://wttr.in/Odesa?format=j1");
        const data = await res.json();
        const current = data.current_condition[0];
        const weatherHTML = `
          <h3>🌤 ${lang === 'en' ? 'Weather' : 'Погода'}</h3>
          <div>🌡 ${lang === 'en' ? 'Temp' : 'Темп'}: ${current.temp_C}°C (${current.FeelsLikeC}°C)</div>
          <div>💨 ${lang === 'en' ? 'Wind' : 'Вітер'}: ${current.windspeedKmph} km/h (${current.winddir16Point})</div>
          <div>💧 ${lang === 'en' ? 'Humidity' : 'Вологість'}: ${current.humidity}%</div>
          <div>🔵 ${lang === 'en' ? 'Pressure' : 'Тиск'}: ${current.pressure} hPa</div>
          <div>🌫 ${lang === 'en' ? 'Visibility' : 'Видимість'}: ${current.visibility} km</div>
          <div style="margin-top: 0.5rem; padding-top: 0.5rem; border-top: 1px solid var(--accent);">
            🌅 <strong>${lang === 'en' ? 'Sunrise' : 'Схід сонця'}:</strong> ${data.weather[0].astronomy[0].sunrise}<br>
            🌇 <strong>${lang === 'en' ? 'Sunset' : 'Захід сонця'}:</strong> ${data.weather[0].astronomy[0].sunset}
          </div>`;
        document.getElementById("weather").innerHTML = weatherHTML;
      } catch (e) {
        console.error("Weather error:", e);
        document.getElementById("weather").textContent = `⚠️ ${lang === 'en' ? 'Weather unavailable' : 'Погода недоступна'}`;
      }
    }

    loadWeather();
    checkAirAlert();
    setInterval(loadWeather, 600000); // 10 хвилин
    setInterval(checkAirAlert, 300000); // 5 хвилин

    if (Notification.permission !== "denied") {
      Notification.requestPermission();
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Watch Command System</title>
  <style>
    :root {
      --background: #0a0f2c;
      --text: #ffffff;
      --card: #12183d;
      --accent: #00ff88;
    }

    [data-theme="light"] {
      --background: #ffffff;
      --text: #000000;
      --card: #f0f0f0;
      --accent: #007acc;
    }

    body {
      margin: 0;
      font-family: sans-serif;
      background-color: var(--background);
      color: var(--text);
      transition: all 0.3s ease;
    }

    .card {
      background-color: var(--card);
      padding: 1rem;
      border-radius: 10px;
      margin: 1rem;
    }

    .controls {
      position: fixed;
      top: 1rem;
      right: 1rem;
      display: flex;
      gap: 0.5rem;
    }

    .flag {
      width: 24px;
      height: 16px;
      cursor: pointer;
      border: 1px solid #ccc;
    }

    .online {
      color: var(--accent);
      font-weight: bold;
    }

    .dot {
      height: 10px;
      width: 10px;
      background-color: var(--accent);
      border-radius: 50%;
      display: inline-block;
      margin-right: 5px;
    }
  </style>
</head>
<body>
  <div class="controls">
    <button onclick="toggleTheme()">🌓</button>
    <img src="https://flagcdn.com/w20/ua.png" class="flag" onclick="setLang('ua')">
    <img src="https://flagcdn.com/w20/ru.png" class="flag" onclick="setLang('ru')">
    <img src="https://flagcdn.com/w20/gb.png" class="flag" onclick="setLang('en')">
  </div>

  <div class="card">
    <h1 data-i18n="watchCommand">Watch Command System</h1>
    <div id="clock"></div>
    <div id="currentShift"></div>
    <div id="weather"></div>
    <div id="airAlert"></div>
  </div>

  <script>
    const langData = {
      en: { watchCommand: "Watch Command System", airAlert: "Air Alert", onWatch: "On watch now" },
      ua: { watchCommand: "Вахтовий Командний Центр", airAlert: "Повітряна тривога", onWatch: "Зараз на вахті" },
      ru: { watchCommand: "Вахтенный Командный Центр", airAlert: "Воздушная тревога", onWatch: "Сейчас на вахте" }
    };

    let lang = localStorage.getItem('lang') || 'ua';
    function setLang(l) {
      lang = l;
      localStorage.setItem('lang', lang);
      translate();
    }

    function translate() {
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        el.textContent = langData[lang][key];
      });
    }

    translate();

    function toggleTheme() {
      const theme = document.documentElement.getAttribute('data-theme');
      const newTheme = theme === 'light' ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', newTheme);
      localStorage.setItem('theme', newTheme);
    }

    document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'dark');

    // Clock
    setInterval(() => {
      const now = new Date();
      document.getElementById('clock').textContent = now.toLocaleTimeString();
      updateCurrentShift(now);
    }, 1000);

    const shifts = {
      "Tuesday": [
        { name: "Yaryk", shifts: ["09:00-12:00", "21:00-00:00"] },
        { name: "Zhenya", shifts: ["12:00-15:00", "00:00-03:00"] },
        { name: "Dan", shifts: ["15:00-18:00", "03:00-06:00"] },
        { name: "Yura", shifts: ["18:00-21:00", "06:00-09:00"] },
        { name: "Gurikhanyan", status: "off" },
        { name: "Katran", status: "canteen" }
      ],
      "Wednesday": [
        { name: "Gurikhanyan", shifts: ["09:00-12:00", "21:00-00:00"] },
        { name: "Zhenya", shifts: ["12:00-15:00", "00:00-03:00"] },
        { name: "Dan", shifts: ["15:00-18:00", "03:00-06:00"] },
        { name: "Katran", shifts: ["18:00-21:00", "06:00-09:00"] },
        { name: "Yaryk", status: "off" },
        { name: "Yura", status: "canteen" }
      ],
      "Thursday": [
        { name: "Gurikhanyan", shifts: ["09:00-12:00", "21:00-00:00"] },
        { name: "Yura", shifts: ["12:00-15:00", "00:00-03:00"] },
        { name: "Yaryk", shifts: ["15:00-18:00", "03:00-06:00"] },
        { name: "Katran", shifts: ["18:00-21:00", "06:00-09:00"] },
        { name: "Zhenya", status: "off" },
        { name: "Dan", status: "canteen" }
      ]
    };

    function isNowInRange(rangeStr, now) {
      const [start, end] = rangeStr.split('-').map(t => {
        const [h, m] = t.split(':').map(Number);
        return h * 60 + m;
      });
      const current = now.getHours() * 60 + now.getMinutes();
      if (end < start) {
        return current >= start || current < end; // crosses midnight
      }
      return current >= start && current < end;
    }

    function updateCurrentShift(now) {
  const day = now.toLocaleDateString('en', { weekday: 'long' });
  let shiftHTML = `<h3>${langData[lang].onWatch}:</h3>`;
  (shifts[day] || []).forEach(person => {
    let line = "";
    if (person.shifts) {
      const activeShift = person.shifts.find(shift => isNowInRange(shift, now));
      line += activeShift
        ? `<span class="dot"></span> ${person.name} <span class="online">${langData[lang].onWatch}</span> <small>(${activeShift})</small>`
        : `${person.name}`;
    } else if (person.status === "off") {
      line += `<span style="color:red">🔴</span> ${person.name} <span style="color:red">вихідний</span>`;
    } else if (person.status === "canteen") {
      line += `🍴 ${person.name} <span style="color:orange">столова</span>`;
    }
    shiftHTML += `<div>${line}</div>`;
  });
  document.getElementById('currentShift').innerHTML = shiftHTML;
}

async function checkAirAlert() {
  try {
    const res = await fetch("https://api.alerts.in.ua/v1/alerts/odessa-oblast");
    const data = await res.json();
    const active = data.some(alert => alert.active);
    const alertEl = document.getElementById("airAlert");
    if (active) {
      alertEl.textContent = `🚨 ${langData[lang].airAlert}`;
    } else {
      alertEl.textContent = `✅ Все спокійно`;
    }
    if (Notification.permission === "granted" && active) {
      new Notification(`${langData[lang].airAlert}!`, { body: "Одеська область!" });
    }
  } catch (e) {
    document.getElementById("airAlert").textContent = `⚠️ ${langData[lang].airAlert} недоступна`;
  }
}
    // Open-Meteo
    async function loadWeather() {
      try {
        const res = await fetch("https://api.open-meteo.com/v1/forecast?latitude=46.48&longitude=30.73&current=temperature_2m,relative_humidity_2m,wind_speed_10m,pressure_msl&daily=sunrise,sunset&timezone=auto");
        const data = await res.json();
        const w = data.current;
        const weatherHTML = `
  <h3>🌤 Weather</h3>
  <div>🌡 Temp: ${w.temperature_2m}°C</div>
  <div>💨 Wind: ${w.wind_speed_10m} m/s</div>
  <div>💧 Humidity: ${w.relative_humidity_2m}%</div>
  <div>🔵 Pressure: ${w.pressure_msl} hPa</div>
  <div style="margin-top: 0.5rem; padding-top: 0.5rem; border-top: 1px solid var(--accent);">
    🌅 <strong>Sunrise:</strong> ${data.daily.sunrise?.[0] || "-"}<br>
    🌇 <strong>Sunset:</strong> ${data.daily.sunset?.[0] || "-"}
  </div>
`;

    loadWeather();
  </script>
</body>
</html>

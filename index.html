<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Watch Command System</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="favicon.ico" type="image/x-icon" />
</head>
<body>
  <div class="controls">
    <button onclick="toggleTheme()">🌓</button>
    <select onchange="setLang(this.value)">
      <option value="ua">Українська</option>
      <option value="en">English</option>
    </select>
  </div>

  <div class="card">
    <h3 data-i18n="watchCommand">Watch Command System</h3>
    <div id="dateTime"></div>
    <div id="currentShift" class="section"></div>
    <div id="weather" class="section"></div>
    <div id="radiation" class="section"></div>
    <div id="airAlert" class="section"></div>
    <div id="events" class="section"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>

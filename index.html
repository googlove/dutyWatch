<!DOCTYPE html>
<html lang="ua">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="title">Вахтовий центр</title>
  <style>
    :root {
      --background: #0a0f2c;
      --text: #ffffff;
      --card: #12183d;
    }
    [data-theme="light"] {
      --background: #ffffff;
      --text: #000000;
      --card: #f0f0f0;
    }
    body {
      margin: 0;
      font-family: sans-serif;
      background-color: var(--background);
      color: var(--text);
      transition: all 0.3s ease;
    }
    .container {
      padding: 1rem;
      max-width: 900px;
      margin: auto;
    }
    .card {
      background-color: var(--card);
      padding: 1rem;
      border-radius: 10px;
      margin: 1rem 0;
    }
    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
    }
    select, button {
      padding: 0.5rem;
      border-radius: 8px;
      border: none;
    }
    @media (max-width: 600px) {
      .controls {
        flex-direction: column;
        align-items: stretch;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="controls">
      <select id="languageSwitcher">
        <option value="ua">🇺🇦 Українська</option>
        <option value="en">🇬🇧 English</option>
        <option value="ru">🇷🇺 Русский</option>
      </select>
      <button onclick="toggleTheme()">🌓 <span data-i18n="toggleTheme">Тема</span></button>
    </div>

    <div class="card">
      <h1 data-i18n="title">Вахтовий центр</h1>
      <p id="dateTime"></p>
      <p id="airAlert" data-i18n="loading">Завантаження тривоги...</p>
    </div>

    <div class="card">
      <h2 data-i18n="schedule">Розклад вахт</h2>
      <div id="scheduleContent"></div>
    </div>

    <div class="card">
      <h2 data-i18n="weather">Погода</h2>
      <div id="weatherContent">Завантаження...</div>
    </div>
  </div>

  <script>
    const translations = {
      ua: { title:"Вахтовий центр", toggleTheme:"Тема", schedule:"Розклад вахт",
        alert:"Повітряна тривога", noAlert:"Немає тривоги", loading:"Завантаження тривоги...",
        weather:"Погода", onDuty:"На вахті", off:"Вихідний", dining:"Їдальня"
      },
      en: { title:"Watch Command Center", toggleTheme:"Theme", schedule:"Watch Schedule",
        alert:"Air Raid Alert", noAlert:"No Alert", loading:"Loading alert...",
        weather:"Weather", onDuty:"On Duty", off:"Day Off", dining:"Dining Room"
      },
      ru: { title:"Вахтенный центр", toggleTheme:"Тема", schedule:"График вахт",
        alert:"Воздушная тревога", noAlert:"Нет тревоги", loading:"Загрузка тревоги...",
        weather:"Погода", onDuty:"На вахте", off:"Выходной", dining:"Столовая"
      }
    };
    const scheduleData = {
      Monday:{Denis:"09:00‑12:00, 21:00‑00:00",Zhenya:"12:00‑15:00, 00:00‑03:00",
        Katran:"15:00‑18:00, 03:00‑06:00",Gurikhanyan:"18:00‑21:00, 06:00‑09:00",Yarik:"dining"},
      Tuesday:{Yaryk:"09:00‑12:00, 21:00‑00:00",Zhenya:"12:00‑15:00, 00:00‑03:00",
        Dan:"15:00‑18:00, 03:00‑06:00",Yura:"18:00‑21:00, 06:00‑09:00",Gurikhanyan:"off",Katran:"dining"},
      Wednesday:{Gurikhanyan:"09:00‑12:00, 21:00‑00:00",Zhenya:"12:00‑15:00, 00:00‑03:00",
        Dan:"15:00‑18:00, 03:00‑06:00",Katran:"18:00‑21:00, 06:00‑09:00",Yarik:"off",Yura:"dining"},
      Thursday:{Gurikhanyan:"09:00‑12:00, 21:00‑00:00",Yura:"12:00‑15:00, 00:00‑03:00",
        Yarik:"15:00‑18:00, 03:00‑06:00",Katran:"18:00‑21:00, 06:00‑09:00",Zhenya:"off",Dan:"dining"}
    };

    let lang = localStorage.getItem("lang") || "ua";
    let theme = localStorage.getItem("theme") || "dark";
    document.getElementById("languageSwitcher").value = lang;
    document.documentElement.setAttribute("data-theme", theme);

    const i18n = (k)=>translations[lang][k]||k;
    function translatePage(){
      document.querySelectorAll("[data-i18n]").forEach(el=>{
        el.textContent = i18n(el.getAttribute("data-i18n"));
      });
    }
    translatePage();

    document.getElementById("languageSwitcher").onchange = function(e){
      lang = e.target.value;
      localStorage.setItem("lang", lang);
      translatePage();
      renderSchedule();
      fetchWeather();
    };

    function toggleTheme(){
      theme = theme==="light"? "dark":"light";
      document.documentElement.setAttribute("data-theme", theme);
      localStorage.setItem("theme", theme);
    }

    function updateTime(){
      const now=new Date();
      const opts={weekday:"long",year:"numeric",month:"long",day:"numeric",hour:"2-digit",minute:"2-digit"};
      document.getElementById("dateTime").textContent = now.toLocaleString(
        lang==="ua"?"uk-UA":lang==="ru"?"ru-RU":"en-US", opts);
    }
    setInterval(updateTime,60000);
    updateTime();

    function renderSchedule(){
      const today=new Date().toLocaleDateString("en", {weekday:"long"});
      const s=scheduleData[today];
      const cont=document.getElementById("scheduleContent");
      cont.innerHTML = `<h3>${today}</h3>`;
      if (!s) return cont.innerHTML+=`<p>${i18n("noAlert")}</p>`;
      for (const [name,status] of Object.entries(s)){
        let text = status==="off"?i18n("off"):
                   status==="dining"?i18n("dining"):
                   `${i18n("onDuty")}: ${status}`;
        cont.innerHTML += `<p><strong>${name}</strong>: ${text}</p>`;
      }
    }
    renderSchedule();

    async function checkAirAlert(){
      try{
        const res=await fetch("https://api.alerts.in.ua/v1/alerts/odessa-oblast");
        const alerts=await res.json();
        const active=alerts.some(a=>a.active);
        document.getElementById("airAlert").textContent = active?
          `🚨 ${i18n("alert")}` : `✅ ${i18n("noAlert")}`;
        if (Notification.permission==="granted" && active){
          new Notification(i18n("alert")+"!",{body:"Одеса: "+i18n("alert")});
        }
      }catch(e){
        document.getElementById("airAlert").textContent="⚠️ Error loading alert";
      }
    }
    if (Notification.permission!=="granted") Notification.requestPermission();
    checkAirAlert(); setInterval(checkAirAlert,60000);

    async function fetchWeather(){
      const el=document.getElementById("weatherContent");
      try{
        const res=await fetch("https://api.open-meteo.com/v1/forecast?latitude=46.48&longitude=30.73&current=temperature_2m,wind_speed_10m,humidity_2m,pressure_msl&daily=sunrise,sunset&timezone=Europe%2FKyiv");
        const d=await res.json();
        const c=d.current;
        const sunrise=d.daily.sunrise[0].split("T")[1];
        const sunset=d.daily.sunset[0].split("T")[1];
        el.innerHTML=`
          ${i18n("weather")}:<br>
          ${c.temperature_2m} °C, Вітер: ${c.wind_speed_10m} м/с, Вологість: ${c.humidity_2m}%<br>
          Тиск: ${c.pressure_msl} гПа<br>
          Схід: ${sunrise}, Захід: ${sunset}`;
      }catch{
        el.textContent="⚠️ Error loading weather";
      }
    }
    fetchWeather();
  </script>
</body>
</html>
